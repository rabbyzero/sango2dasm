# Standalone linker config for prg_0c_0d.asm verification
MEMORY {
    ZEROPAGE:   start = $0000, size = $0100, type = rw;
    RAM:        start = $0100, size = $0700, type = rw;
    PRG_SLOT1:  start = $A000, size = $4000, type = ro, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE:    load = ZEROPAGE,  type = zp;
    BSS:         load = RAM,       type = bss, define = yes;
    CODE_BANK0C: load = PRG_SLOT1, type = ro;
}
