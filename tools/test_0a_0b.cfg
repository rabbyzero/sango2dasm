# Test linker config for combined banks $0A and $0B
MEMORY {
    PRG0A: start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/test_0a.bin";
    PRG0B: start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/test_0b.bin";
}

SEGMENTS {
    CODE_BANK0A: load = PRG0A, type = ro;
    CODE_BANK0B: load = PRG0B, type = ro;
}
