# linker.cfg - Linker configuration for Sangokushi 2 - Haou no Tairiku
# Namco-163 (Mapper 19) - 256KB PRG ROM, 256KB CHR ROM
#
# Memory Map:
#   $0000-$07FF: RAM (2KB)
#   $0800-$1FFF: RAM mirrors
#   $2000-$2007: PPU registers
#   $2008-$3FFF: PPU register mirrors
#   $4000-$401F: APU/IO registers
#   $4020-$5FFF: Expansion ROM (Namco-163)
#   $6000-$7FFF: SRAM (8KB) - Battery backed
#   $8000-$FFFF: PRG ROM (switchable 8KB banks)
#
# Namco-163 PRG ROM Configuration:
#   32 x 8KB banks = 256KB
#   Banks are switched via $F800-$FFFF range
#
# Build Strategy:
#   Each bank outputs to a separate file (build/bankXX.bin) with the correct
#   CPU start address for label resolution. The Makefile concatenates all 32
#   bank files in order to produce the full 256KB PRG binary.

MEMORY {
    # Zero page RAM (no ROM output)
    ZEROPAGE:   start = $0000, size = $0100, type = rw;

    # System RAM (no ROM output)
    RAM:        start = $0100, size = $0700, type = rw;

    # PRG ROM Banks - each outputs to its own file
    # Banks 00-07: loaded at $8000 (stub banks, address irrelevant for .incbin)
    BANK00: start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank00.bin";
    BANK01: start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank01.bin";
    BANK02: start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank02.bin";
    BANK03: start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank03.bin";
    BANK04: start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank04.bin";
    BANK05: start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank05.bin";
    BANK06: start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank06.bin";
    BANK07: start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank07.bin";

    # Banks 08-09: combined disassembly ($A000-$DFFF)
    BANK08: start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank08.bin";
    BANK09: start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank09.bin";

    # Banks 0A-0B: combined disassembly ($A000-$DFFF)
    BANK0A: start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank0a.bin";
    BANK0B: start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank0b.bin";

    # Banks 0C-0D: combined disassembly ($A000-$DFFF)
    BANK0C: start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank0c.bin";
    BANK0D: start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank0d.bin";

    # Banks 0E-0F: combined disassembly ($A000-$DFFF)
    BANK0E: start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank0e.bin";
    BANK0F: start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank0f.bin";

    # Banks 10-16: loaded at $8000 (stub banks)
    BANK10: start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank10.bin";
    BANK11: start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank11.bin";
    BANK12: start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank12.bin";
    BANK13: start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank13.bin";
    BANK14: start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank14.bin";
    BANK15: start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank15.bin";
    BANK16: start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank16.bin";

    # Banks 17-18: combined disassembly ($A000-$DFFF)
    BANK17: start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank17.bin";
    BANK18: start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank18.bin";

    # Banks 19-1A: combined disassembly ($A000-$DFFF)
    BANK19: start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank19.bin";
    BANK1A: start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank1a.bin";

    # Banks 1B-1C: combined disassembly ($A000-$DFFF)
    BANK1B: start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank1b.bin";
    BANK1C: start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank1c.bin";

    # Banks 1D-1E: combined disassembly ($A000-$DFFF)
    BANK1D: start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank1d.bin";
    BANK1E: start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank1e.bin";

    # Bank 1F: fixed boot bank ($E000-$FFFF)
    BANK1F: start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF, file = "build/bank1f.bin";
}

SEGMENTS {
    # Zero page variables (RAM only, no ROM output)
    ZEROPAGE:    load = ZEROPAGE, type = zp;

    # Uninitialized RAM (no ROM output)
    BSS:         load = RAM,      type = bss, define = yes;

    # PRG Bank segments
    CODE_BANK00: load = BANK00, type = ro;
    CODE_BANK01: load = BANK01, type = ro;
    CODE_BANK02: load = BANK02, type = ro;
    CODE_BANK03: load = BANK03, type = ro;
    CODE_BANK04: load = BANK04, type = ro;
    CODE_BANK05: load = BANK05, type = ro;
    CODE_BANK06: load = BANK06, type = ro;
    CODE_BANK07: load = BANK07, type = ro;
    CODE_BANK08: load = BANK08, type = ro;
    CODE_BANK09: load = BANK09, type = ro;
    CODE_BANK0A: load = BANK0A, type = ro;
    CODE_BANK0B: load = BANK0B, type = ro;
    CODE_BANK0C: load = BANK0C, type = ro;
    CODE_BANK0D: load = BANK0D, type = ro;
    CODE_BANK0E: load = BANK0E, type = ro;
    CODE_BANK0F: load = BANK0F, type = ro;
    CODE_BANK10: load = BANK10, type = ro;
    CODE_BANK11: load = BANK11, type = ro;
    CODE_BANK12: load = BANK12, type = ro;
    CODE_BANK13: load = BANK13, type = ro;
    CODE_BANK14: load = BANK14, type = ro;
    CODE_BANK15: load = BANK15, type = ro;
    CODE_BANK16: load = BANK16, type = ro;
    CODE_BANK17: load = BANK17, type = ro;
    CODE_BANK18: load = BANK18, type = ro;
    CODE_BANK19: load = BANK19, type = ro;
    CODE_BANK1A: load = BANK1A, type = ro;
    CODE_BANK1B: load = BANK1B, type = ro;
    CODE_BANK1C: load = BANK1C, type = ro;
    CODE_BANK1D: load = BANK1D, type = ro;
    CODE_BANK1E: load = BANK1E, type = ro;
    CODE_BANK1F: load = BANK1F, type = ro;
}
