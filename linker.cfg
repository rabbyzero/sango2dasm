# linker.cfg - Linker configuration for Sangokushi 2 - Haou no Tairiku
# Namco-163 (Mapper 19) - 256KB PRG ROM, 256KB CHR ROM
#
# Memory Map:
#   $0000-$07FF: RAM (2KB)
#   $0800-$1FFF: RAM mirrors
#   $2000-$2007: PPU registers
#   $2008-$3FFF: PPU register mirrors
#   $4000-$401F: APU/IO registers
#   $4020-$5FFF: Expansion ROM (Namco-163)
#   $6000-$7FFF: SRAM (8KB) - Battery backed
#   $8000-$FFFF: PRG ROM (switchable 8KB banks)
#
# Namco-163 PRG ROM Configuration:
#   32 x 8KB banks = 256KB
#   Banks are switched via $F800-$FFFF range

MEMORY {
    # Zero page RAM
    ZEROPAGE:   start = $0000, size = $0100, type = rw;

    # System RAM
    RAM:        start = $0100, size = $0700, type = rw;

    # PRG ROM - 4 switchable 8KB slots ($8000-$FFFF)
    PRG_SLOT0:  start = $8000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_SLOT1:  start = $A000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_SLOT2:  start = $C000, size = $2000, type = ro, fill = yes, fillval = $FF;
    PRG_SLOT3:  start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF;
}

SEGMENTS {
    # Zero page variables
    ZEROPAGE:   load = ZEROPAGE,  type = zp;

    # Uninitialized RAM
    BSS:        load = RAM,       type = bss, define = yes;

    # Code segments - Bank 0x1F contains reset handler
    CODE:       load = PRG_SLOT0, type = ro;
    VECTORS:    load = PRG_SLOT0, type = ro, start = $9FFA;

    # Additional banked code (optional)
    CODE0:      load = PRG_SLOT0, type = ro, optional = yes;
    CODE1:      load = PRG_SLOT1, type = ro, optional = yes;
    CODE2:      load = PRG_SLOT2, type = ro, optional = yes;
    CODE3:      load = PRG_SLOT3, type = ro, optional = yes;

    # Bank 1F code (boot bank, fixed at $E000-$FFFF)
    CODE_BANK1F: load = PRG_SLOT3, type = ro, optional = yes;

    # Read-only data
    RODATA:     load = PRG_SLOT3, type = ro, optional = yes;
    RODATA0:    load = PRG_SLOT0, type = ro, optional = yes;
    RODATA1:    load = PRG_SLOT1, type = ro, optional = yes;
    RODATA2:    load = PRG_SLOT2, type = ro, optional = yes;
}
